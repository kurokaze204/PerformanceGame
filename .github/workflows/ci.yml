name: CI

on:
  push:
    branches: [main, fix/core-game-loop-v1]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test:core
      - run: bun run test:balance
      - run: bun run test:balance:team
      - run: bun run test:balance:strategy
      - name: Upload balance study results
        uses: actions/upload-artifact@v4
        with:
          name: balance-study-results
          path: balance-results/
          retention-days: 90
      - run: bun run build
