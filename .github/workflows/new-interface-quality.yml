name: New Interface Quality

on:
  push:
    branches: [feat/new-interface]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Core smoke tests
        run: npm run test:core
      - name: UI mode smoke tests
        run: npm run test:ui
