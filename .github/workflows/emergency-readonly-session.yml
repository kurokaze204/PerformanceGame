name: One-off KM Week session health (read only)
on:
  push:
    branches: [diagnose-kmhsrbw]
permissions:
  contents: read
jobs:
  inspect-session:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect live session status without revealing player details
        run: |
          node <<'NODE'
          (async()=>{
            const url='https://performancegapgame.deltaknowledge.net/api/sessions/KMHSRBW';
            const ctrl=new AbortController();
            const timer=setTimeout(()=>ctrl.abort(),12000);
            try{
              const response=await fetch(url,{signal:ctrl.signal,headers:{accept:'application/json'}});
              console.log('HTTP_STATUS:',response.status);
              const body=await response.text();
              let session;
              try{session=JSON.parse(body)}catch{console.log('NON_JSON_RESPONSE');return}
              if(!response.ok){console.log('SESSION_FETCH_ERROR:',session.error||'no error detail');return}
              const companies=Array.isArray(session.companies)?session.companies:[];
              const summary={
                sessionFound:true,
                mode:session.experienceMode,
                sessionRound:session.round,
                globalPhase:session.phase,
                timerStarted:!!session.timerStartedAt,
                companyCount:companies.length,
                companies:companies.map((company,index)=>({
                  number:index+1,
                  companyRound:company.round,
                  roundPhase:company.roundPhase,
                  kmWeekStage:company.kmWeek?.stage,
                  kmWeekPhase:company.kmWeek?.phase,
                  guidedTurn:company.kmWeek?.guidedTurn,
                  freeRound:company.kmWeek?.freeRound,
                  challengeCount:company.kmWeek?.challenges?.length,
                  challenges:company.kmWeek?.challenges?.map(challenge=>({
                    id:challenge.id,
                    status:challenge.status,
                    domain:challenge.domain,
                    difficulty:challenge.difficulty,
                    resolution:challenge.resolution
                  })),
                  investments:company.kmWeek?.investmentHistory?.length,
                  score:company.kmWeek?.score?.total,
                  hasController:!!company.controllerParticipantId,
                }))
              };
              console.log('READ_ONLY_SESSION_SUMMARY_BEGIN');
              console.log(JSON.stringify(summary,null,2));
              console.log('READ_ONLY_SESSION_SUMMARY_END');
            }catch(e){console.error('SESSION_INSPECTION_FAILURE:',e.message);process.exitCode=1}
            finally{clearTimeout(timer)}
          })();
          NODE
